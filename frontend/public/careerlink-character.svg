<svg id="careerlink-character" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="800" viewBox="0 0 1000 800">
  <defs>
    <linearGradient id="cl-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6c63ff" />
    </linearGradient>
    <linearGradient id="cl-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3d56" />
      <stop offset="100%" stop-color="#2f2e41" />
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Blobs -->
  <path d="M420,110 C580,80 780,120 860,250 C940,380 910,540 820,640 C730,740 540,780 390,750 C240,720 120,620 100,480 C80,340 260,140 420,110 Z" fill="#6c63ff" opacity="0.08" />
  <circle cx="210" cy="180" r="45" fill="#6c63ff" opacity="0.06" />
  <circle cx="850" cy="190" r="30" fill="#6c63ff" opacity="0.06" />
  <ellipse cx="510" cy="740" rx="360" ry="24" fill="#6c63ff" opacity="0.12" />

  <!-- Background Job Portal UI Dashboard (Left / Center) -->
  <g id="job-portal-board">
    <!-- Main Portal Frame -->
    <rect x="140" y="190" width="440" height="490" rx="20" fill="#242238" stroke="#3f3d56" stroke-width="2" />
    
    <!-- Window Header -->
    <rect x="140" y="190" width="440" height="44" rx="20" fill="#2f2e41" />
    <rect x="140" y="214" width="440" height="20" fill="#2f2e41" />
    <circle cx="168" cy="212" r="5" fill="#ff5f56" />
    <circle cx="184" cy="212" r="5" fill="#ffbd2e" />
    <circle cx="200" cy="212" r="5" fill="#27c93f" />
    
    <!-- Portal Header Bar -->
    <rect x="230" y="204" width="180" height="16" rx="8" fill="#3f3d56" />
    <text x="320" y="216" fill="#a5b4fc" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">CAREERLINK PORTAL</text>

    <!-- Search / Filter Bar -->
    <rect x="165" y="254" width="390" height="40" rx="10" fill="#1b1a29" stroke="#6c63ff" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="190" cy="274" r="9" fill="none" stroke="#8b5cf6" stroke-width="2.5" />
    <line x1="197" y1="281" x2="206" y2="290" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" />
    <rect x="218" y="268" width="150" height="12" rx="6" fill="#4c4969" />
    <rect x="470" y="262" width="72" height="24" rx="6" fill="url(#cl-grad-accent)" />
    <text x="506" y="278" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">SEARCH</text>

    <!-- Job Listing Card 1 (Selected / Active) -->
    <rect x="165" y="312" width="390" height="100" rx="12" fill="#2f2d4a" stroke="#6c63ff" stroke-width="2" />
    <!-- Company Badge / Avatar -->
    <rect x="182" y="328" width="44" height="44" rx="10" fill="#6c63ff" />
    <path d="M194,354 L204,338 L214,354 Z" fill="#ffffff" opacity="0.9" />
    <circle cx="204" cy="344" r="4" fill="#2f2d4a" />
    <!-- Job Title & Company -->
    <rect x="238" y="328" width="180" height="14" rx="7" fill="#ffffff" opacity="0.9" />
    <rect x="238" y="348" width="110" height="10" rx="5" fill="#8e8ca8" />
    <!-- Match Badge -->
    <rect x="468" y="328" width="72" height="20" rx="10" fill="#10b981" opacity="0.2" />
    <text x="504" y="342" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">98% MATCH</text>
    <!-- Skill Tags -->
    <rect x="238" y="372" width="58" height="18" rx="5" fill="#1b1a29" stroke="#6c63ff" stroke-width="1" stroke-opacity="0.5" />
    <text x="267" y="385" fill="#c4b5fd" font-family="monospace" font-size="9" text-anchor="middle">Spring</text>
    <rect x="302" y="372" width="52" height="18" rx="5" fill="#1b1a29" stroke="#6c63ff" stroke-width="1" stroke-opacity="0.5" />
    <text x="328" y="385" fill="#c4b5fd" font-family="monospace" font-size="9" text-anchor="middle">React</text>
    <rect x="360" y="372" width="68" height="18" rx="5" fill="#1b1a29" stroke="#6c63ff" stroke-width="1" stroke-opacity="0.5" />
    <text x="394" y="385" fill="#c4b5fd" font-family="monospace" font-size="9" text-anchor="middle">Postgres</text>
    <rect x="472" y="370" width="68" height="22" rx="6" fill="#6c63ff" />
    <text x="506" y="385" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">APPLY ↗</text>

    <!-- Job Listing Card 2 -->
    <rect x="165" y="426" width="390" height="80" rx="12" fill="#1c1b2c" stroke="#3f3d56" stroke-width="1" />
    <rect x="182" y="442" width="38" height="38" rx="8" fill="#3b3955" />
    <circle cx="201" cy="461" r="9" fill="#6c63ff" opacity="0.6" />
    <rect x="232" y="444" width="150" height="12" rx="6" fill="#e2e8f0" opacity="0.8" />
    <rect x="232" y="464" width="90" height="8" rx="4" fill="#6b6889" />
    <rect x="478" y="442" width="62" height="18" rx="9" fill="#6c63ff" opacity="0.15" />
    <text x="509" y="455" fill="#a78bfa" font-family="monospace" font-size="9" text-anchor="middle">Verified</text>
    <rect x="232" y="482" width="48" height="14" rx="4" fill="#28263d" />
    <rect x="286" y="482" width="48" height="14" rx="4" fill="#28263d" />

    <!-- Job Listing Card 3 -->
    <rect x="165" y="520" width="390" height="80" rx="12" fill="#1c1b2c" stroke="#3f3d56" stroke-width="1" />
    <rect x="182" y="536" width="38" height="38" rx="8" fill="#3b3955" />
    <rect x="232" y="538" width="160" height="12" rx="6" fill="#e2e8f0" opacity="0.8" />
    <rect x="232" y="558" width="100" height="8" rx="4" fill="#6b6889" />
    <rect x="232" y="576" width="54" height="14" rx="4" fill="#28263d" />
    <rect x="292" y="576" width="54" height="14" rx="4" fill="#28263d" />

    <!-- Application Status Floating Pill -->
    <rect x="190" y="618" width="180" height="34" rx="17" fill="#10b981" />
    <circle cx="208" cy="635" r="8" fill="#ffffff" />
    <path d="M204,635 L207,638 L213,632" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="282" y="639" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Application Hired!</text>
  </g>

  <!-- Connecting Analytics / Match Nodes -->
  <path d="M530,360 C610,340 640,280 700,290" fill="none" stroke="#6c63ff" stroke-width="3" stroke-dasharray="6,6" opacity="0.6" />
  <circle cx="700" cy="290" r="8" fill="#6c63ff" />
  <circle cx="700" cy="290" r="15" fill="#6c63ff" opacity="0.2" />

  <!-- Floating Recruitment Badge (Top Right) -->
  <g id="recruiter-badge" transform="translate(680, 130)">
    <rect x="0" y="0" width="180" height="68" rx="14" fill="#242238" stroke="#8b5cf6" stroke-width="1.5" />
    <circle cx="34" cy="34" r="18" fill="url(#cl-grad-accent)" />
    <!-- User/Recruiter Icon -->
    <circle cx="34" cy="28" r="6" fill="#ffffff" />
    <path d="M24,42 C24,37 28,35 34,35 C40,35 44,37 44,42 Z" fill="#ffffff" />
    <rect x="62" y="20" width="100" height="12" rx="6" fill="#ffffff" opacity="0.9" />
    <rect x="62" y="38" width="70" height="8" rx="4" fill="#a78bfa" />
  </g>

  <!-- CareerLink Developer / Candidate Character (Right Side) -->
  <g id="candidate-character">
    <!-- Legs / Trousers -->
    <path d="M720,530 L705,730 L740,730 L755,560 L770,730 L805,730 L790,530 Z" fill="#242238" />
    <!-- Shoes -->
    <ellipse cx="698" cy="735" rx="22" ry="9" fill="#3f3d56" />
    <ellipse cx="812" cy="735" rx="22" ry="9" fill="#3f3d56" />
    
    <!-- Torso / Suit Jacket & Shirt -->
    <path d="M690,360 L810,360 L825,540 L675,540 Z" fill="#303d5c" />
    <!-- Inner Shirt / Tie -->
    <polygon points="740,360 760,360 755,460 745,460" fill="#ffffff" />
    <polygon points="748,375 752,375 756,440 750,455 744,440" fill="#6c63ff" />
    <!-- Jacket Lapels -->
    <polygon points="690,360 740,460 730,540 680,540" fill="#28334d" />
    <polygon points="810,360 760,460 770,540 820,540" fill="#28334d" />

    <!-- Left Arm & Hand Holding Professional Briefcase -->
    <path d="M690,370 L645,460 L655,520 L675,520 L670,470 L700,390 Z" fill="#303d5c" />
    <!-- Hand -->
    <circle cx="665" cy="528" r="10" fill="#fdc2cc" />
    <!-- Briefcase -->
    <g id="briefcase" transform="translate(635, 525)">
      <rect x="0" y="12" width="60" height="46" rx="6" fill="#3f3d56" stroke="#242238" stroke-width="2" />
      <path d="M20,12 L20,4 C20,2 24,0 30,0 C36,0 40,2 40,4 L40,12" fill="none" stroke="#6c63ff" stroke-width="3" />
      <rect x="25" y="24" width="10" height="8" rx="2" fill="#fbbf24" />
      <line x1="0" y1="28" x2="60" y2="28" stroke="#2f2e41" stroke-width="2" />
    </g>

    <!-- Head & Neck -->
    <rect x="738" y="328" width="24" height="36" fill="#fdc2cc" />
    <ellipse cx="750" cy="300" rx="30" ry="36" fill="#fdc2cc" />
    
    <!-- Face Features (Minimalist flat vector) -->
    <!-- Eyes -->
    <circle cx="738" cy="298" r="3" fill="#2f2e41" />
    <circle cx="758" cy="298" r="3" fill="#2f2e41" />
    <!-- Smile -->
    <path d="M742,314 Q748,322 754,314" fill="none" stroke="#2f2e41" stroke-width="2" stroke-linecap="round" />
    
    <!-- Modern Tech Hair -->
    <path d="M720,290 C715,260 740,245 765,248 C785,250 790,268 784,285 C780,272 765,265 745,268 C730,270 722,280 720,290 Z" fill="#2f2e41" />
    <path d="M718,290 Q726,260 762,254 Q788,256 786,280 Q776,262 748,266 Q728,272 718,290 Z" fill="#3f3d56" />

    <!-- Right Arm Holding High-Tech Job Tablet -->
    <path d="M810,370 L855,440 L825,500 L805,490 L830,445 L795,385 Z" fill="#303d5c" />
    <circle cx="815" cy="495" r="10" fill="#fdc2cc" />

    <!-- Interactive Tablet in Hand -->
    <g id="candidate-tablet" transform="translate(775, 430) rotate(-12)">
      <rect x="0" y="0" width="80" height="110" rx="8" fill="#1e1b2e" stroke="#8b5cf6" stroke-width="2" />
      <rect x="6" y="8" width="68" height="94" rx="4" fill="#2d2b42" />
      <!-- Tablet Screen Header -->
      <rect x="12" y="14" width="40" height="6" rx="3" fill="#8b5cf6" />
      <!-- Match Stats on Tablet -->
      <circle cx="40" cy="44" r="16" fill="#10b981" opacity="0.2" />
      <circle cx="40" cy="44" r="12" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="24,8" />
      <text x="40" y="48" fill="#34d399" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">✓</text>
      <!-- Offer Line -->
      <rect x="12" y="68" width="56" height="5" rx="2.5" fill="#ffffff" opacity="0.9" />
      <rect x="12" y="78" width="38" height="5" rx="2.5" fill="#a78bfa" />
      <rect x="12" y="88" width="56" height="8" rx="4" fill="#6c63ff" />
      <text x="40" y="94" fill="#ffffff" font-family="sans-serif" font-size="6" font-weight="bold" text-anchor="middle">OFFER ACCEPTED</text>
    </g>
  </g>

  <!-- Decorative Floating Developer & Recruitment Badges -->
  <!-- Spring Boot / Java Badge -->
  <g transform="translate(100, 480)">
    <circle cx="28" cy="28" r="28" fill="#242238" stroke="#10b981" stroke-width="1.5" />
    <text x="28" y="25" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">&lt;JAVA&gt;</text>
    <text x="28" y="38" fill="#a7f3d0" font-family="monospace" font-size="8" text-anchor="middle">Spring</text>
  </g>

  <!-- React / Fullstack Badge -->
  <g transform="translate(860, 460)">
    <circle cx="26" cy="26" r="26" fill="#242238" stroke="#6c63ff" stroke-width="1.5" />
    <text x="26" y="24" fill="#a78bfa" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">REACT</text>
    <text x="26" y="36" fill="#c4b5fd" font-family="monospace" font-size="7" text-anchor="middle">FullStack</text>
  </g>

</svg>
